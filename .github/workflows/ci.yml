name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: expense-tracker-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Temurin 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: expense-tracker-api/pom.xml
      - name: Verify
        run: ./mvnw --batch-mode verify
      - name: Upload coverage
        if: ${{ always() && hashFiles('expense-tracker-api/target/site/jacoco/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: expense-tracker-api/target/site/jacoco/
          if-no-files-found: error
